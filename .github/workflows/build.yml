name: Build MegamboOS (Space Optimized)

on:
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf /usr/lib/jvm
          # Очистка кэша пакетов
          sudo apt-get clean
          df -h # Покажет, сколько места стало

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev repo
          git config --global user.name "mbov777"
          git config --global user.email "твой_email"

      - name: Sync Source
        run: |
          mkdir -p ~/android && cd ~/android
          repo init -u https://github.com/crdroidandroid/android.git -b 13.0 --depth=1
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags
          
      - name: Clone Device Tree
        run: |
          cd ~/android
          git clone https://github.com/crdroidandroid/android_device_xiaomi_sapphire -b 13.0 device/xiaomi/sapphire --depth=1
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_sapphire -b 13.0 vendor/xiaomi/sapphire --depth=1
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm6225 -b lineage-20 kernel/xiaomi/chime --depth=1

      - name: Build ROM
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineag_sapphire-userdebug
          mka bacon -j$(nproc --all)
