name: Build MegamboOS (Max Disk Space Edition)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free Disk Space (The Nuclear Option)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc build-essential zip curl libstdc++6 git wget python3 gcc clang libssl-dev repo
          git config --global user.name "mbov777"
          git config --global user.email "megambo@example.com"

      - name: Sync Source (Android 14)
        run: |
          mkdir -p ~/android && cd ~/android
          repo init -u https://github.com/crdroidandroid/android.git -b 14.0 --depth=1 --git-lfs
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          echo "Место после тотальной синхронизации:"
          df -h | grep "/$"

      - name: Clone Device Tree
        run: |
          cd ~/android
          git clone https://github.com/crdroidandroid/android_device_xiaomi_sapphire -b 14.0 device/xiaomi/sapphire --depth=1
          git clone https://github.com/TheMuppets/proprietary_vendor_xiaomi_sapphire -b 14.0 vendor/xiaomi/sapphire --depth=1
          git clone https://github.com/LineageOS/android_kernel_xiaomi_sm6225 -b lineage-21 kernel/xiaomi/chime --depth=1
          git clone https://github.com/LineageOS/android_hardware_xiaomi -b lineage-21 hardware/xiaomi --depth=1

      - name: Build Firmware
        run: |
          cd ~/android
          source build/envsetup.sh
          lunch lineage_sapphire-userdebug
          # Ограничиваем j до 4, чтобы не переполнить диск временными файлами компиляции
          mka bacon -j4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MegamboOS-v10-Sapphire
          path: ~/android/out/target/product/sapphire/*.zip
